spec_version: "0.1.0"
name: "treasury-liquidity-ladder-optimizer"
version: "1.0.0"
category: "finance"
author: "Rucha Salpure"
description: "Optimizes multi-currency commercial paper, repo, and short-term treasury maturity ladders to maximize yield while meeting statutory liquidity coverage ratios"
capabilities:
  - "liquidity-coverage-ratio-optimization"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "liquidity-coverage-ratio-optimization"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
